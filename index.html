<!DOCTYPE html>
<html lang="zh-tw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>chihirotsuki ✧ vtuber</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f7f0eb 0%, #e8dfd8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      padding: clamp(0.8rem, 3vw, 2rem);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(255, 247, 242, 0.30);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 0;
      pointer-events: none;
    }

    /* ===== 卡片容器 ===== */
    .cards-wrapper {
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 2.5vw, 1.8rem);
      position: relative;
      z-index: 1;
    }

    /* ===== 主卡片 ===== */
    .card {
      width: 100%;
      background: rgba(255, 247, 242, 0.70);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: clamp(28px, 6vw, 56px);
      padding: clamp(1.5rem, 4vw, 2.8rem) clamp(1.2rem, 3.5vw, 2.5rem) clamp(1.8rem, 4vw, 3rem);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 8px 20px rgba(140, 100, 80, 0.10);
      border: 1px solid rgba(255, 235, 220, 0.5);
      transition: all 0.3s ease;
    }

    /* ===== 圖片卡片 ===== */
    .image-card {
      width: 100%;
      background: rgba(255, 247, 242, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: clamp(28px, 6vw, 56px);
      padding: 6px;                    
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.10), 0 8px 20px rgba(140, 100, 80, 0.08);
      border: 1px solid rgba(255, 235, 220, 0.4);
      overflow: hidden;
      box-sizing: border-box;
    }

    .image-card img {
      width: 100%;
      height: 400px !important;                  /* ← 調高圖片 */
      display: block;
      border-radius: clamp(16px, 3vw, 32px);
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .image-card img:hover {
      transform: scale(1.01);
    }

    .image-card .image-label {
      margin-top: clamp(0.3rem, 0.8vw, 0.6rem);
      font-size: clamp(0.55rem, 1.2vw, 0.75rem);
      font-weight: 500;
      color: #6f5546;
      text-align: center;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }

    /* 頭部 */
    .header-tags {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(0.75rem, 1.8vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #5b4b3e;
      border-bottom: 1px solid rgba(200, 175, 160, 0.25);
      padding-bottom: 0.6rem;
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
    }

    .header-tags .owo {
      background: #d9c8bc;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      color: #2f241d;
      font-size: clamp(0.7rem, 1.6vw, 0.9rem);
      font-weight: 600;
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    /* 頭像區域 */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: clamp(0.8rem, 2.5vw, 1.6rem);
      margin-top: clamp(0.2rem, 1vw, 0.6rem);
    }

    .avatar-circle {
      width: clamp(72px, 16vw, 120px);
      height: clamp(72px, 16vw, 120px);
      border-radius: 50%;
      background: #dccfc6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(130, 90, 70, 0.15), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 3px solid rgba(255, 245, 235, 0.7);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-circle:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(130, 90, 70, 0.20);
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-name {
      margin-top: clamp(0.3rem, 1vw, 0.6rem);
      font-size: clamp(0.7rem, 1.6vw, 1rem);
      font-weight: 500;
      color: #4d3a2e;
      letter-spacing: 0.5px;
      background: rgba(235, 215, 200, 0.3);
      padding: 0.1rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 235, 220, 0.3);
    }

    /* 引言 */

    .intro-text {
      white-space: pre-line; /* 換行用 */
    }

    .intro-content {
      font-size: clamp(0.8rem, 1.8vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #7a6558;
      margin-bottom: clamp(0.6rem, 1.8vw, 1.2rem);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 我的連結 */
    .my-links-title {
      font-size: clamp(0.8rem, 1.8vw, 1.05rem);
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #7a6558;
      margin-bottom: clamp(0.6rem, 1.8vw, 1.2rem);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .my-links-title i {
      font-size: clamp(0.8rem, 1.6vw, 1.1rem);
      color: #b18b78;
    }

    /* 連結網格 */
    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(0.4rem, 1.5vw, 0.9rem) clamp(0.5rem, 1.8vw, 1.2rem);
      background: rgba(235, 218, 208, 0.2);
      padding: clamp(0.6rem, 2vw, 1.2rem) clamp(0.7rem, 2.5vw, 1.8rem);
      border-radius: clamp(28px, 8vw, 60px);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 225, 210, 0.3);
      justify-content: center;
    }

    .link-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(245, 233, 224, 0.7);
      backdrop-filter: blur(4px);
      padding: clamp(0.2rem, 0.8vw, 0.5rem) clamp(0.7rem, 1.6vw, 1.2rem) clamp(0.2rem, 0.8vw, 0.5rem) clamp(0.5rem, 1.2vw, 1rem);
      border-radius: 60px;
      font-size: clamp(0.65rem, 1.4vw, 0.9rem);
      font-weight: 500;
      color: #3f3229;
      box-shadow: 0 1px 4px rgba(120, 80, 60, 0.08);
      transition: all 0.2s;
      border: 1px solid rgba(255, 235, 220, 0.4);
      text-decoration: none;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .link-item i {
      font-size: clamp(0.8rem, 1.8vw, 1.2rem);
      width: clamp(1rem, 2vw, 1.4rem);
      text-align: center;
      color: #7f5f4b;
    }

    .link-item:hover {
      background: #f5e6dc;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(150, 110, 90, 0.12);
      border-color: #dbbdab;
    }

    /* 底部 */
    .footer-note {
      margin-top: clamp(1.2rem, 3vw, 2.2rem);
      display: flex;
      justify-content: flex-end;
      font-size: clamp(0.55rem, 1.2vw, 0.75rem);
      letter-spacing: 0.5px;
      color: #866f60;
      border-top: 1px solid rgba(180, 150, 135, 0.2);
      padding-top: clamp(0.5rem, 1.5vw, 1rem);
      gap: clamp(0.4rem, 1.8vw, 1.2rem);
      flex-wrap: wrap;
    }

    .footer-note span i {
      margin-right: 4px;
      color: #b18874;
    }

    /* 手機 */
    @media (max-width: 400px) {
      .links-grid {
        justify-content: center;
        padding: 0.5rem 0.6rem;
      }
      .link-item {
        font-size: 0.6rem;
        padding: 0.15rem 0.5rem;
      }
      .header-tags {
        justify-content: center;
      }
      /* ===== 手機上圖片也調大 ===== */
      .image-card {
        padding: 4px;
      }
      .image-card img {
        height: 180px;
      }
    }

    @media (min-width: 1024px) {
      .card {
        padding: 2.8rem 3rem 3.2rem;
      }
      .links-grid {
        padding: 1.2rem 2rem;
      }
      .image-card img {
        height: 350px;    
      }
    }
  </style>
</head>
<body>

  <div class="cards-wrapper">

    <!-- ===== 主卡片 ===== -->
    <div class="card">
      <div class="header-tags">
        <span class="owo"><i class="fas fa-pager" style="margin-right: 4px;"></i> vtuber </span>

      <div class="avatar-section">

      <div class="my-links-title">

    <!-- ===== 連結 ===== -->
      <div class="my-links-title">

      <div class="links-grid">
        <a href="https://www.youtube.com/@ChihiroMoon" class="link-item" target="_blank"><i class="fab fa-youtube"></i> YOUTUBE</a>

    </div>

    <!-- ===== 圖片卡片 ===== -->
    <div class="image-card">
      <img
        src="三視圖.png"

        loading="lazy"

      <div class="image-label">✨三視圖✨</div>
    </div>

  </div>

</body>
</html>
